name: guacamoleb opt baseline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  KERNEL_IMAGE: Image
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_oneplus_sm8150
  KERNEL_COMMIT: 0521dc291cf10bd754fb5ff385e74875c406d577
  CLANG_TARBALL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/9916fb51ccb914d62d35ad9a7b9b21d2ef046928/clang-r563880c.tar.gz
  AVBTOOL_URL: https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache cpio curl device-tree-compiler flex git kmod libelf-dev libssl-dev lz4 python3 rsync zip zstd
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch boot.img
        run: |
          set -euxo pipefail
          python3 scripts/fetch_boot.py "https://download.lineageos.org/api/v2/devices/guacamoleb/builds" "$GITHUB_WORKSPACE/official_boot.img"
          python3 -c "import pathlib;b=pathlib.Path('$GITHUB_WORKSPACE/official_boot.img').read_bytes();print('magic',b[:8],'size',len(b))"

      - name: Fetch avbtool
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --max-time 120 "$AVBTOOL_URL" -o avbtool.b64
          python3 -c "import base64,pathlib;pathlib.Path('avbtool.py').write_bytes(base64.b64decode(pathlib.Path('avbtool.b64').read_bytes()))"

      - name: Fetch kernel source
        run: |
          set -euxo pipefail
          git clone --depth=1 "$KERNEL_REPO" kernel
          cd kernel
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          git log --oneline -1
          git config user.name ci
          git config user.email ci@localhost

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-clang-r563880c-manifest-9916fb5-v1

      - name: Fetch toolchains
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"
          CLANG_DIR="$PWD/clang"
          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            mkdir -p "$CLANG_DIR"
            curl -L --fail --retry 3 --retry-delay 5 --max-time 900 "$CLANG_TARBALL" -o clang.tar.gz
            tar xzf clang.tar.gz -C "$CLANG_DIR"
            rm -f clang.tar.gz
          fi
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          chmod -R u+rwX,go+rX "$CLANG_DIR"
          find "$CLANG_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} +
          "$CLANG_DIR/bin/clang" --version | head -1

      - name: Config (official)
        working-directory: kernel
        run: |
          set -uxo pipefail
          export PATH="$CLANG_DIR/bin:$PATH"
          mkdir -p out
          python3 "$GITHUB_WORKSPACE/scripts/extract_config.py" "$GITHUB_WORKSPACE/official_boot.img" out/.config || true
          echo "::notice::boot_img_size=$(stat -c%s "$GITHUB_WORKSPACE/official_boot.img" 2>/dev/null || echo MISSING)"
          echo "::notice::outconfig_size=$(stat -c%s out/.config 2>/dev/null || echo MISSING)"
          test -s out/.config || { echo "::error::extract_config produced no out/.config"; exit 3; }
          cp "$GITHUB_WORKSPACE/scripts/kmake.sh" .
          bash ./kmake.sh olddefconfig > /tmp/olddefconfig.log 2>&1 || {
            tail -60 /tmp/olddefconfig.log | while IFS= read -r l; do echo "::error::olddefconfig: $l"; done
            exit 2
          }
          echo "KERNEL_RELEASE=$(bash ./kmake.sh -s kernelrelease 2>/dev/null | tail -1)" >> "$GITHUB_ENV"

      - name: Pin vermagic
        working-directory: kernel
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/pin_vermagic.py" . "$GITHUB_WORKSPACE/official_boot.img" out/.config
          echo "KERNEL_RELEASE=$(bash ./kmake.sh -s kernelrelease | tail -1)" >> "$GITHUB_ENV"

      - name: Build kernel
        working-directory: kernel
        run: |
          set -uxo pipefail
          export PATH="$CLANG_DIR/bin:$PATH"
          cp "$GITHUB_WORKSPACE/scripts/kmake.sh" .
          bash ./kmake.sh -j"$(nproc --all)" "$KERNEL_IMAGE" modules > "$GITHUB_WORKSPACE/build.log" 2>&1
          rc=$?
          tail -40 "$GITHUB_WORKSPACE/build.log"
          if [ "$rc" -ne 0 ]; then
            grep -E 'error:|Error [0-9]|undefined (reference|symbol)' "$GITHUB_WORKSPACE/build.log" | head -30 | while IFS= read -r line; do echo "::error::build: ${line}"; done
            exit "$rc"
          fi

      - name: Repack boot
        run: |
          set -euxo pipefail
          python3 scripts/repack_boot.py "kernel/out/arch/arm64/boot/${KERNEL_IMAGE}" "$GITHUB_WORKSPACE/official_boot.img" "$GITHUB_WORKSPACE/boot-guacamoleb-opt.img" avbtool.py
          mkdir -p avbcheck
          cp "$GITHUB_WORKSPACE"/boot-guacamoleb-opt.img avbcheck/boot.img
          python3 avbtool.py verify_image --image avbcheck/boot.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-guacamoleb-opt
          path: boot-guacamoleb-opt.img
          if-no-files-found: error
          retention-days: 30

      - name: Upload config and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-and-log-opt-${{ github.sha }}
          path: |
            kernel/out/.config
            build.log
          if-no-files-found: warn
          retention-days: 14
