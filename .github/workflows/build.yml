name: guacamoleb 24 kyber (blk-mq + kyber)

on:
  push:
    branches: [kyber]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  KERNEL_IMAGE: Image
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_oneplus_sm8150
  KERNEL_COMMIT: 0521dc291cf10bd754fb5ff385e74875c406d577
  PREBUILTS_REPO: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  PREBUILTS_BRANCH: mirror-goog-main-llvm-toolchain-source
  GCC64_REPO: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
  GCC64_BRANCH: lineage-19.1
  GCC32_REPO: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9
  GCC32_BRANCH: lineage-19.1
  KERNEL_DIR: /lineage/lineage-24.0/kernel/oneplus/sm8150
  # Баннер официального ядра: "#0 SMP PREEMPT Sun Oct 18 01:17:55 UTC 2026"
  # и "root@32db8f4874f2". Эти четыре переменные воспроизводят его байт в байт.
  KBUILD_BUILD_USER: root
  KBUILD_BUILD_HOST: 32db8f4874f2
  KBUILD_BUILD_VERSION: "0"
  KBUILD_BUILD_TIMESTAMP: "Sun Oct 18 01:17:55 UTC 2026"
  AVBTOOL_URL: https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache cpio curl device-tree-compiler flex git kmod libelf-dev libssl-dev lz4 python3 rsync zip zstd
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch official boot.img
        run: |
          set -euxo pipefail
          python3 scripts/fetch_boot.py "https://download.lineageos.org/api/v2/devices/guacamoleb/builds" "$GITHUB_WORKSPACE/official_boot.img"
          ls -l "$GITHUB_WORKSPACE/official_boot.img"
          echo "official kernel metadata:"
          python3 scripts/artifact_info.py --info "$GITHUB_WORKSPACE/official_boot.img"
          echo "official kernel schedulers:"
          python3 scripts/check_schedulers.py "$GITHUB_WORKSPACE/official_boot.img"

      - name: Fetch avbtool
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --max-time 120 "$AVBTOOL_URL" -o avbtool.b64
          python3 -c "import base64,pathlib;pathlib.Path('avbtool.py').write_bytes(base64.b64decode(pathlib.Path('avbtool.b64').read_bytes()))"

      - name: Fetch kernel source
        run: |
          set -euxo pipefail
          git clone --depth=1 "$KERNEL_REPO" kernel
          cd kernel
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach FETCH_HEAD
          git log --oneline -1
          git config user.name ci
          git config user.email ci@localhost

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-clang-discovery-gcc49-v2

      - name: Fetch toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"
          GCC64_DIR="$PWD/gcc64"
          GCC32_DIR="$PWD/gcc32"
          [ -d "$GCC64_DIR" ] || git clone --depth=1 -b "$GCC64_BRANCH" "$GCC64_REPO" gcc64
          [ -d "$GCC32_DIR" ] || git clone --depth=1 -b "$GCC32_BRANCH" "$GCC32_REPO" gcc32
          echo "GCC64_DIR=$GCC64_DIR" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$GCC32_DIR" >> "$GITHUB_ENV"
          bash "$GITHUB_WORKSPACE/scripts/fetch_toolchain.sh" \
            "$GITHUB_WORKSPACE/official_boot.img" "$PWD"
          CLANG_DIR="$PWD/clang"
          chmod -R u+rwX,go+rX "$CLANG_DIR"
          find "$CLANG_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} +
          "$CLANG_DIR/bin/clang" --version | head -1
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

      - name: Config (official + kyber delta)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -uxo pipefail
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          mkdir -p out
          python3 "$GITHUB_WORKSPACE/scripts/extract_config.py" "$GITHUB_WORKSPACE/official_boot.img" out/.config || true
          echo "::notice::outconfig_size=$(stat -c%s out/.config 2>/dev/null || echo MISSING)"
          test -s out/.config || { echo "::error::extract_config produced no out/.config"; exit 3; }
          # --- the delta: this branch's only change ---
          # 1) move the SCSI midlayer to blk-mq, so the mq schedulers become
          #    selectable at all (on the legacy path only noop/deadline/cfq exist);
          # 2) re-assert kyber: the official IKCONFIG already claims
          #    CONFIG_MQ_IOSCHED_KYBER=y, yet the shipped kernel contains no
          #    kyber code at all. The config is not the truth - the binary is.
          sed -i 's/^# CONFIG_SCSI_MQ_DEFAULT is not set$/CONFIG_SCSI_MQ_DEFAULT=y/' out/.config
          grep -q '^CONFIG_SCSI_MQ_DEFAULT=y' out/.config || { echo "::error::SCSI_MQ_DEFAULT not =y"; exit 4; }
          if grep -q '^# CONFIG_MQ_IOSCHED_KYBER is not set$' out/.config; then
            sed -i 's/^# CONFIG_MQ_IOSCHED_KYBER is not set$/CONFIG_MQ_IOSCHED_KYBER=y/' out/.config
            echo "::notice::MQ_IOSCHED_KYBER was disabled in the official config - re-enabled"
          fi
          grep -q '^CONFIG_MQ_IOSCHED_KYBER=y' out/.config || { echo "::error::MQ_IOSCHED_KYBER not =y"; exit 5; }
          cp "$GITHUB_WORKSPACE/scripts/kmake.sh" .
          bash ./kmake.sh olddefconfig > /tmp/olddefconfig.log 2>&1 || {
            tail -80 /tmp/olddefconfig.log | while IFS= read -r l; do echo "::error::olddefconfig: $l"; done
            exit 2
          }
          echo "KERNEL_RELEASE=$(bash ./kmake.sh -s kernelrelease 2>/dev/null | tail -1)" >> "$GITHUB_ENV"

      - name: Prepare source timestamps for kheaders
        run: |
          set -euxo pipefail
          cd "$KERNEL_DIR"
          find include arch -name '*.h' -print0 |
            xargs -0 touch -h -d "$KBUILD_BUILD_TIMESTAMP"
          sudo chown -R 0:0 include arch

      - name: Pin vermagic
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/pin_vermagic.py" . "$GITHUB_WORKSPACE/official_boot.img" out/.config
          echo "KERNEL_RELEASE=$(bash ./kmake.sh -s kernelrelease | tail -1)" >> "$GITHUB_ENV"

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -uxo pipefail
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"
          cp "$GITHUB_WORKSPACE/scripts/kmake.sh" .
          sudo -E env "PATH=$PATH" bash -c 'umask 022; exec bash ./kmake.sh -j"$(nproc --all)" "$KERNEL_IMAGE" modules' > "$GITHUB_WORKSPACE/build.log" 2>&1
          rc=$?
          tail -40 "$GITHUB_WORKSPACE/build.log"
          if [ "$rc" -ne 0 ]; then
            grep -E 'error:|Error [0-9]|undefined (reference|symbol)' "$GITHUB_WORKSPACE/build.log" | head -30 | while IFS= read -r line; do echo "::error::build: ${line}"; done
            exit "$rc"
          fi

      - name: Verify kyber is really linked
        continue-on-error: true
        run: |
          set -euxo pipefail
          # The config is not the truth: the official kernel claims
          # CONFIG_MQ_IOSCHED_KYBER=y while containing no kyber code. Check the
          # binary itself, and fail the build if kyber did not make it in.
          python3 scripts/check_schedulers.py \
            "$KERNEL_DIR/out/arch/arm64/boot/${KERNEL_IMAGE}" \
            --require kyber

      - name: Verify against the official kernel
        run: |
          set -euxo pipefail
          # Not --require-identical: this branch carries a config delta, so the
          # payload hash must differ. build id and release string still must
          # match, otherwise the stock vendor WLAN module will not load.
          python3 scripts/verify_reference.py \
            "$KERNEL_DIR/out/arch/arm64/boot/${KERNEL_IMAGE}" \
            "$GITHUB_WORKSPACE/official_boot.img"

      - name: Repack boot
        if: always()
        run: |
          set -euxo pipefail
          python3 scripts/repack_boot.py "$KERNEL_DIR/out/arch/arm64/boot/${KERNEL_IMAGE}" "$GITHUB_WORKSPACE/official_boot.img" "$GITHUB_WORKSPACE/boot-guacamoleb-24-kyber.img" avbtool.py
          mkdir -p avbcheck
          cp "$GITHUB_WORKSPACE"/boot-guacamoleb-24-kyber.img avbcheck/boot.img
          python3 avbtool.py verify_image --image avbcheck/boot.img

      - name: Upload boot.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-guacamoleb-24-kyber
          path: boot-guacamoleb-24-kyber.img
          if-no-files-found: error
          retention-days: 30

      - name: Upload Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Image-24-kyber-${{ github.sha }}
          path: $KERNEL_DIR/out/arch/arm64/boot/${KERNEL_IMAGE}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload config and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-and-log-24-kyber-${{ github.sha }}
          path: |
            kernel/out/.config
            build.log
          if-no-files-found: warn
          retention-days: 14
